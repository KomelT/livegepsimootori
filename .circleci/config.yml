version: 2.1
orbs:
  browser-tools: circleci/browser-tools@1.4.0
  codecov: codecov/codecov@3.2.5

commands:
  prepare-docker:
    steps:
      - checkout
      - run: ./gen-local-certs.sh
      - run: chmod -R 755 ./letsencrypt/live/test.meshtrail.si/
      - run: echo "127.0.0.1 test.meshtrail.si api.test.meshtrail.si www.test.meshtrail.si events.test.meshtrail.si dashboard.test.meshtrail.si halden-sk.test.meshtrail.si kangasala-sk.test.meshtrail.si registration.test.meshtrail.si livelox.test.meshtrail.si loggator.test.meshtrail.si gpsseuranta.test.meshtrail.si" | sudo tee -a /etc/hosts
      - run: mkdir -p media/routechoices/maps/
      - run: mv ./.env.dev ./.env
      - run: echo "SECURE_SSL_REDIRECT = False" > ./routechoices/settings_overrides.py
      - run: echo "DEBUG = False" >> ./routechoices/settings_overrides.py
      - run: ./dc up -d
      - run: ./da migrate
      - run: ./da collectstatic
      - run: ./da compress
      - run: ./dc restart nginx

  setup-docker:
    steps:
      - run:
          name: Setup buildx and qemu
          command: |
            sudo apt-get update
            sudo apt-get install -y qemu-user-static
            sudo apt-get install -y binfmt-support
      - run:
          name: Check versions
          command: |
            qemu-aarch64-static --version
            update-binfmts --version
      - run:
          name: Create builder
          command: |
            export DOCKER_CLI_EXPERIMENTAL=enabled
            docker buildx create --name arm-builder
            docker buildx use arm-builder
            docker buildx inspect --bootstrap

jobs:
  python-tests:
    machine:
      image: ubuntu-2204:current
      docker_layer_caching: false
    resource_class: large
    steps:
      - prepare-docker
      - run: ./dc restart django
      - run: timeout 300 bash -c 'while [[ "$(curl -s -o /dev/null -w ''%{http_code}'' https://www.test.meshtrail.si/)" != "200" ]]; do sleep 5; done' || false
      - run: ./test
      - codecov/upload:
          file: coverage.xml
          flags: unittests

  e2e-tests:
    machine:
      image: ubuntu-2204:current
      docker_layer_caching: false
    resource_class: large
    steps:
      - prepare-docker
      - run: ./dc stop django
      - run:
          command: ./dc up -d
          environment:
            WSGI_FILE: wsgi-with-cov
            NUM_PROCESSES: 1
      - run: timeout 300 bash -c 'while [[ "$(curl -s -o /dev/null -w ''%{http_code}'' https://www.test.meshtrail.si/)" != "200" ]]; do sleep 5; done' || false
      - run: sudo apt update
      - run: sudo apt install -y libgbm-dev
      - browser-tools/install-chrome
      - run:
          name: Install Node.js and run cypress
          # https://www.cloudesire.com/how-to-upgrade-node-on-circleci-machine-executor/
          command: |
            export NVM_DIR="/opt/circleci/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            nvm install v25 && nvm use v25 && nvm alias default v25
            node -v
            npm install --global pnpm
            pnpm install
            TZ=Europe/Helsinki pnpm cypress run --browser chrome
      - run: docker kill --signal=HUP rc_django
      - run: sleep 5
      - run: ./dc exec django coverage xml
      - codecov/upload:
         file: coverage.xml
         flags: e2e
      - store_artifacts:
          path: cypress/videos
      - store_artifacts:
          path: cypress/screenshots

  build-docker:
    machine:
      image: ubuntu-2204:current
    resource_class: large
    steps:
      - checkout
      - setup-docker
      - run:
          name: Connect account
          command: |
            echo "$DOCKER_PASS" | docker login -u "$DOCKER_USER" --password-stdin
      - run:
          name: Build docker images
          command: |
            DOCKER_CLI_EXPERIMENTAL=enabled docker buildx build --progress plain --platform linux/amd64 --push -t rphlo/routechoices-dev-server:latest -f docker/django.dockerfile .

workflows:
  version: 2
  run_tests:
    jobs:
      - python-tests
      - e2e-tests
  build_image:
    jobs:
      - build-docker:
          filters:
            tags:
              only: /v.*/
            branches:
              ignore: /.*/
